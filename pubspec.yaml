name: fable
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  google_mlkit_subject_segmentation: ^0.2.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/nest/
    - assets/images/nest/cutouts/
    - assets/images/nest_logo.png

  # Fonts (both licensed under the SIL Open Font License 1.1).
  # Instrument Serif: expressive headings. Lato: body text, labels, metadata.
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/nest_logo.png"
  adaptive_icon_background: "#F5F0E8"
  adaptive_icon_foreground: "assets/images/nest_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F5F0E8"
  android: true
  ios: false
  android_12:
    color: "#F5F0E8"

